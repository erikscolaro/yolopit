[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yolopit"
version = "0.1.0"
description = "Structured channel pruning of Ultralytics YOLO26 with PLiNIO PIT, in blocks of N channels"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Erik Scolaro"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# Versions are pinned in step 3 (see README, "Versions").
dependencies = [
    "torch",
    "ultralytics",
    "pyyaml",
    "matplotlib",
    # yolopit patches PLiNIO internals: keep this exact commit. PLiNIO's setup.py does not
    # declare its own requirements, so the ones PIT imports are listed here.
    "networkx",
    "tdigest",
    "plinio @ git+https://github.com/eml-eda/plinio.git@3d6b5e08b3c7d861620ecc9ab25bff82852f8c7c",
]

[project.optional-dependencies]
test = ["pytest", "onnx", "onnxruntime"]

[tool.setuptools]
packages = ["yolopit"]
# old module names, kept so that checkpoints and scripts made before 0.1 still load
py-modules = ["pit_yolo", "pit_block_masks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains on coco8 (minutes on CPU)"]
addopts = "-m 'not slow'"
